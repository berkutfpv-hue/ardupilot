name: Build by Matek743
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi python3-pip python3-dev ccache
        pip3 install empy==3.3.4 pexpect future intelhex
    - name: Build Copter for Matek743
      run: |
          ./waf configure --board Matek_743
          ./waf copter
    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
         name: Matek743
         path: build/Matek743/bin/arducopter*
  
