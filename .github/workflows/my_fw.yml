name: Build by VOLT81_FC_RS_001
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi python3-pip python3-dev ccache
        pip3 install empy==3.3.4 pexpect future intelhex
    - name: Build Copter for VOLT81_FC_RS_001
      run: |
          python3 Tools/scripts/build_bootloaders.py VOLT81_FC_RS_001
          ./waf configure --board VOLT81_FC_RS_001
          ./waf copter
    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
         name: VOLT81_FC_RS_001
         path: build/VOLT81_FC_RS_001/bin/arducopter*
  
